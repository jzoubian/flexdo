[package]
name = "flexdo"
version = "0.1.0"
edition = "2021"
authors = ["Julien Zoubian"]
license = "GPL-3.0"
description = "A flexible command-line task manager with priority-driven focus sessions"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
rodio = "0.18"
crossterm = "0.28"
colored = "2.1"
uuid = { version = "1.7", features = ["serde", "v4"] }
anyhow = "1.0"
dirs = "5.0"
